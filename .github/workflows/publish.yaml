name: Publish to Maven Central

on:
  workflow_dispatch:
  release:
    types: [created]

permissions: read-all

jobs:
  test-release-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Check out recovery conformance profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: runcycles/cycles-protocol
          ref: b27d7cb38a8f2bd915dea64e4369a2b91f31008c
          path: .cycles-protocol
          persist-credentials: false
      - run: python -m pip install PyYAML
      - name: Run shared durable recovery scenarios
        run: >-
          python .cycles-protocol/scripts/run_client_recovery_conformance.py
          --claim durable
          --report-json recovery-conformance.json
          --implementation runcycles/cycles-spring-boot-starter
          --implementation-commit ${{ github.event.pull_request.head.sha || github.sha }}
          --evidence-url https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          --adapter python scripts/recovery_conformance_adapter.py
      - name: Upload recovery conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-conformance-${{ github.event.pull_request.head.sha || github.sha }}
          path: recovery-conformance.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify pom version is not SNAPSHOT
        working-directory: cycles-client-java-spring
        # Sonatype Central rejects SNAPSHOT publishes server-side, but we'd rather
        # fail fast on the runner than wait for the deploy step. Tracked org-wide
        # at runcycles/.github#61.
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "::error::Cannot publish SNAPSHOT version: $VERSION. Drop -SNAPSHOT in the pom before tagging."
            exit 1
          fi
          echo "pom version: $VERSION"

      - name: Verify pom version matches release tag
        if: github.event_name == 'release'
        working-directory: cycles-client-java-spring
        # Catches the case where someone tags v0.1.1 while the pom still says 0.1.0.
        # Sonatype would publish the artifact at the pom version, not the tag,
        # producing a release artifact that doesn't match the git tag.
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pom version ${VERSION}. Bump the pom version to match the tag before re-cutting the release."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches pom version ${VERSION}"

      - name: Test release build without publishing
        working-directory: cycles-client-java-spring
        run: mvn -B -Prelease clean verify

  publish:
    if: github.event_name == 'release'
    needs: test-release-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify pom version is not SNAPSHOT
        working-directory: cycles-client-java-spring
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "::error::Cannot publish SNAPSHOT version: $VERSION. Drop -SNAPSHOT in the pom before tagging."
            exit 1
          fi
          echo "pom version: $VERSION"

      - name: Verify pom version matches release tag
        working-directory: cycles-client-java-spring
        # Belt + suspenders: also verify in the publish job in case the upstream
        # test-release-build check is ever bypassed.
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pom version ${VERSION}."
            exit 1
          fi
          echo "Publishing version: $VERSION (matches tag ${GITHUB_REF_NAME})"

      - name: Publish
        working-directory: cycles-client-java-spring
        run: mvn -B -Prelease clean deploy
