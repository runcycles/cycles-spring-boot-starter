name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: runcycles/.github/.github/workflows/ci-java.yml@v1
    with:
      pom-file: cycles-client-java-spring/pom.xml
      extra-steps: true
      extra-pom-install: cycles-client-java-spring/pom.xml
      extra-pom-compile: cycles-demo-client-java-spring/pom.xml

  recovery-conformance:
    name: Durable recovery conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: runcycles/cycles-protocol
          ref: 594631c14710da08ad5e00125d899d642213c296
          path: .cycles-protocol
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: python -m pip install PyYAML
      - name: Run shared durable recovery scenarios
        run: >-
          python .cycles-protocol/scripts/run_client_recovery_conformance.py
          --claim durable
          --adapter python scripts/recovery_conformance_adapter.py
